[project]
name = "ms-agent-learning"
version = "0.1.0"
description = "Learning project that explores Microsoft Azure AI Agent Framework with a practical incident triage use case."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-agents>=1.1.0",
    "azure-identity>=1.18.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.6.1",
    "typer>=0.12.5",
    "rich>=13.9.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ms-agent-cli = "ms_agent_learning.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_agent_learning"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ms_agent_learning",
    "README.md",
    "docs",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --disable-warnings"
